<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Calculator | Rajan Mastana</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;padding:20px}.calc{width:min(360px,100%);background:#151515;border:1px solid #d4af37;border-radius:20px;padding:20px;box-shadow:0 15px 50px #000}.calc h1{text-align:center;color:#d4af37;font-size:24px}.display{width:100%;height:70px;margin-bottom:15px;padding:10px;text-align:right;font-size:30px;background:#080808;color:#fff;border:1px solid #444;border-radius:10px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}button{height:58px;border:0;border-radius:10px;background:#292929;color:#fff;font-size:20px;font-weight:bold;cursor:pointer}.op,.eq{background:#d4af37;color:#111}.clear{background:#7a2222}.back{display:block;text-align:center;margin-top:17px;color:#d4af37;text-decoration:none}
</style>
</head>
<body>
<div class="calc">
<h1>Digital Calculator</h1>
<input class="display" id="display" value="0" readonly>
<div class="keys">
<button class="clear" onclick="clearDisplay()">C</button><button onclick="del()">⌫</button><button onclick="percent()">%</button><button class="op" onclick="operator('/')">÷</button>
<button onclick="number('7')">7</button><button onclick="number('8')">8</button><button onclick="number('9')">9</button><button class="op" onclick="operator('*')">×</button>
<button onclick="number('4')">4</button><button onclick="number('5')">5</button><button onclick="number('6')">6</button><button class="op" onclick="operator('-')">−</button>
<button onclick="number('1')">1</button><button onclick="number('2')">2</button><button onclick="number('3')">3</button><button class="op" onclick="operator('+')">+</button>
<button onclick="number('0')">0</button><button onclick="decimal()">.</button><button class="eq" onclick="calculate()">=</button><button class="op" onclick="sign()">±</button>
</div>
<a class="back" href="../index.html">← Back to Portfolio</a>
</div>
<script src="calculator.js"></script>
</body>
</html>
