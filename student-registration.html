<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form | Rajan Mastana</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;font-family:Arial,sans-serif;background:#0b0b0b;color:#fff}.box{width:min(700px,100%);background:#151515;border:1px solid #d4af37;border-radius:18px;padding:30px;box-shadow:0 15px 50px #000}.box h1{text-align:center;color:#d4af37;margin:0 0 8px}.sub{text-align:center;color:#aaa;margin-bottom:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;color:#d4af37;font-weight:bold;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#0d0d0d;color:#fff}textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.actions{text-align:center;margin-top:22px}button,a{display:inline-block;padding:12px 22px;border-radius:9px;font-weight:bold;text-decoration:none;cursor:pointer}button{border:0;background:#d4af37;color:#111}.back{margin-left:8px;background:#292929;color:#fff;border:1px solid #555}#success{display:none;text-align:center;color:#8fd694}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="box">
<h1>Student Registration</h1>
<p class="sub">Registration Form — Rajan Mastana Portfolio</p>
<form id="registrationForm">
<div class="grid">
<div><label>Full Name</label><input type="text" required></div>
<div><label>Father's Name</label><input type="text" required></div>
<div><label>Email</label><input type="email" required></div>
<div><label>Phone Number</label><input type="tel" required></div>
<div><label>Class</label><select required><option value="">Select Class</option><option>9th</option><option>10th</option><option>11th</option><option>12th</option></select></div>
<div><label>Gender</label><select required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="full"><label>Course / Stream</label><input type="text"></div>
<div class="full"><label>Address</label><textarea required></textarea></div>
</div>
<div class="actions"><button type="submit">Register</button><a class="back" href="../index.html">Back to Portfolio</a></div>
<p id="success">Registration submitted successfully!</p>
</form>
</div>
<script>
document.getElementById("registrationForm").addEventListener("submit",function(e){e.preventDefault();document.getElementById("success").style.display="block";this.reset();});
</script>
</body>
</html>
